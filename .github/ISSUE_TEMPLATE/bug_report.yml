name: Bug report
description: Report reproducible incorrect behavior in sprites-nebius
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, provider keys, private URLs and customer data. Report suspected vulnerabilities privately to security@fly.io, not in this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence of commands and sanitized configuration that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Include the toolkit commit, agent and version, model ID, Python version and operating system. Include Node.js version for installation problems. Do not include keys or private Sprite/connector identifiers.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste sanitized text. Remove credentials, private URLs, prompts and customer data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
