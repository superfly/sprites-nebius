name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install local test dependencies
        run: python -m pip install -r requirements-configure.txt -r proxy/requirements.txt
      - name: Validate source and run offline tests
        run: python scripts/check
      - name: Install pinned secret scanner
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/nebius-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/nebius-gitleaks gitleaks
      - name: Scan Git history (redacted)
        run: /tmp/nebius-gitleaks/gitleaks git --redact --no-banner .
      - name: Scan current source (redacted)
        run: /tmp/nebius-gitleaks/gitleaks dir --redact --no-banner .

# No connector credentials, Sprite access, agent execution, or paid probes in CI.
